<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1038"/>
      <stop offset="0.7" stop-color="#070a1c"/>
      <stop offset="1" stop-color="#05060f"/>
    </linearGradient>
    <radialGradient id="blue" cx="0.13" cy="0.16" r="0.72">
      <stop offset="0" stop-color="#1E4FD6" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#1E4FD6" stop-opacity="0.45"/>
      <stop offset="0.7" stop-color="#36D6E7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#36D6E7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="red" cx="0.88" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#D41F2E" stop-opacity="0.72"/>
      <stop offset="0.4" stop-color="#D41F2E" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#48060f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redpool" cx="0.92" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#48060f" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#48060f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bluepool" cx="0.06" cy="0.92" r="0.6">
      <stop offset="0" stop-color="#0d1540" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0d1540" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#03040a" stop-opacity="0.82"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#bluepool)"/>
  <rect width="1920" height="1080" fill="url(#redpool)"/>
  <rect width="1920" height="1080" fill="url(#blue)"/>
  <rect width="1920" height="1080" fill="url(#red)"/>
  <!-- faint horizon seam between the blue and red worlds -->
  <rect x="958" y="0" width="4" height="1080" fill="#9fb0d8" opacity="0.05"/>
  <rect width="1920" height="1080" fill="url(#vig)"/>
