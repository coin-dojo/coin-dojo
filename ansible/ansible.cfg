# Ansible config for the coin-dojo arcade-pack deploy layer.
# Everything targets ONE host: the cabinet running Batocera, reached over SSH.
#
#   bin/deploy check            # dry-run everything (ansible-playbook --check --diff)
#   bin/deploy apply            # apply
#   bin/deploy check display    # dry-run one role by tag
#
# See ansible/README.md for the full deploy flow and prerequisites.

[defaults]
# hosts.yml = the cabinet (Batocera + Debian); vm.yml = coin-dojo-vm, the test VM on the Mac (#82).
inventory = inventory/hosts.yml,inventory/vm.yml
roles_path = roles
# Shared filters (#197 hk_settings_state); also found next to site.yml/vm.yml, named here for plays in tests/.
filter_plugins = filter_plugins
stdout_callback = default
result_format = yaml
callback_result_format = yaml
display_skipped_hosts = false
retry_files_enabled = false
interpreter_python = auto_silent
# One host, small library pushes: a little parallelism, nothing heavy.
forks = 4
# Batocera gets reflashed on a spare card, so its SSH host key legitimately changes.
# accept-new trusts a *new* host on first contact but still FAILs if a known key CHANGES
# unexpectedly (MITM). Pragmatic for a home cabinet; see README "Host keys". Verify on hardware.
host_key_checking = True

[ssh_connection]
# BatchMode: never hang on an interactive password prompt in automation. A password, when
# used, is supplied by the wrapper via ansible_ssh_pass (sshpass), never typed here.
ssh_args = -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -o ControlMaster=auto -o ControlPersist=60s
pipelining = true
# Batocera ships rsync + a normal OpenSSH server, so scp/sftp both work; piped is the safe default.
transfer_method = piped
