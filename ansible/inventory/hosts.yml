# Inventory for the coin-dojo cabinet (Debian 13 + ES-DE).
#
# ONE host: the cabinet. Its address, SSH user and port come from the config (config/variables.d/host.yml,
# your config/local.yml): bin/deploy renders them into a generated inventory (tools/config.py render) and
# passes it after this file, so nothing about YOUR cabinet is committed here. Targeted by the play in site.yml.
# The sudo password, if needed, is supplied at run time (the Keychain item named by hk_become_keychain, or the
# env var hk_become_env); NEVER store a password here. The test VM lives in inventory/vm.yml.
all:
  children:
    pios:
      hosts:
        coin-dojo:
          ansible_python_interpreter: /usr/bin/python3
    # esde = every host that runs the ES-DE roles: group_vars/esde.yml (paths, game guard, restart handler vars)
    # is shared by the cabinet and the test VM (#120). `vm` is defined in inventory/vm.yml (both load together).
    esde:
      children:
        pios:
        vm:
