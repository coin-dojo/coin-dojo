; coin-dojo (#88 follow-up, the maintainer 2026-11-15): flycast 2.7 Dreamcast mapping for the cabinet panel ("USB gamepad").
; Reproduces flycast's built-in SDL default (core/sdl/sdl_gamepad.cpp DefaultInputMapping<false,false> applied to
; the cabinet's SDL_GAMECONTROLLERCONFIG: a=b3 b=b2 x=b0 y=b4 leftshoulder=b5 rightshoulder=b1 back=b8 start=b9,
; dpad=hat 0, leftx=a0 lefty=a1, no triggers) EXACTLY, except js 0 and js 4 swap DC X and DC Y:
;   panel LP (js 4, SDL y) -> DC X   (default: DC Y)
;   panel MP (js 0, SDL x) -> DC Y   (default: DC X)
; so six-button fighters get LP = X, MP = Y. Codes are raw joystick buttons; hats are ((hat+1)<<8)|dir.
; No [combo]: Select+Start exit stays with flycast-exit-combo.py. Remove this file = back to the built-in default.
; Tests: skills/controls/tests/test_flycast_mapping.py

[emulator]
mapping_name = USB gamepad
dead_zone = 10
saturation = 100
rumble_power = 100
version = 4
triggers =

[digital]
bind0 = 0:btn_y
bind1 = 1:btn_trigger_right
bind2 = 2:btn_b
bind3 = 3:btn_a
bind4 = 4:btn_x
bind5 = 5:btn_trigger_left
bind6 = 8:btn_menu
bind7 = 9:btn_start
bind8 = 256:btn_dpad1_up
bind9 = 257:btn_dpad1_down
bind10 = 258:btn_dpad1_left
bind11 = 259:btn_dpad1_right

[analog]
bind0 = 0-:btn_analog_left
bind1 = 0+:btn_analog_right
bind2 = 1-:btn_analog_up
bind3 = 1+:btn_analog_down
bind4 = 2-:axis2_left
bind5 = 2+:axis2_right
bind6 = 3-:axis2_up
bind7 = 3+:axis2_down
