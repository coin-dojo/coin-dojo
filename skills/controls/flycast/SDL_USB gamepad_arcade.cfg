; coin-dojo: flycast 2.7 Naomi/Atomiswave mapping for the cabinet panel ("USB gamepad"). NO change on purpose.
; Why it exists: for an arcade game flycast looks for "SDL_USB gamepad_arcade.cfg" and, when it is missing, falls back
; to a copy of the Dreamcast file "SDL_USB gamepad.cfg" (core/input/gamepad_device.cpp find_mapping). Shipping the
; Dreamcast punch swap alone would therefore change every arcade game. This file is flycast's built-in arcade default
; (core/sdl/sdl_gamepad.cpp DefaultInputMapping<true,true>, the one load_system_mappings() picks for arcade games)
; applied to the cabinet's SDL_GAMECONTROLLERCONFIG, so arcade games keep exactly what they had:
;   SDL a (js 3) -> A, b (js 2) -> B, x (js 0) -> C, y (js 4) -> X, LB (js 5) -> L trigger, RB (js 1) -> R trigger.
; Remove both files = back to the built-in defaults. Tests: skills/controls/tests/test_flycast_mapping.py

[emulator]
mapping_name = USB gamepad
dead_zone = 10
saturation = 100
rumble_power = 100
version = 4
triggers =

[digital]
bind0 = 0:btn_c
bind1 = 1:btn_trigger_right
bind2 = 2:btn_b
bind3 = 3:btn_a
bind4 = 4:btn_x
bind5 = 5:btn_trigger_left
bind6 = 8:btn_menu
bind7 = 9:btn_start
bind8 = 256:btn_dpad1_up
bind9 = 257:btn_dpad1_down
bind10 = 258:btn_dpad1_left
bind11 = 259:btn_dpad1_right

[analog]
bind0 = 0-:btn_analog_left
bind1 = 0+:btn_analog_right
bind2 = 1-:btn_analog_up
bind3 = 1+:btn_analog_down
bind4 = 2-:axis2_left
bind5 = 2+:axis2_right
bind6 = 3-:axis2_up
bind7 = 3+:axis2_down
